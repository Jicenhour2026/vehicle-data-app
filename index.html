
<!DOCTYPE html>
<html>
<head>
  <title>Vehicle Lookup</title>
</head>
<body>

<h1>Vehicle Lookup</h1>

<input id="vin" placeholder="Enter VIN">
<button id="btn">Search</button>

<pre id="out">Waiting for search…</pre>

<script>
document.getElementById("btn").onclick = async function () {
  const vinInput = document.getElementById("vin");
  const output = document.getElementById("out");

  const vin = vinInput.value.trim();
  if (!vin) {
    output.textContent = "Please enter a VIN.";
    return;
  }

  try {
    output.textContent = "Searching…";

    const res = await fetch(`/api/lookup?vin=${vin}`);
    const data = await res.json();

    output.textContent = JSON.stringify(data, null, 2);
  } catch (e) {
    output.textContent = "Frontend error: " + e.message;
  }
};
</script>

</body>
</html>
