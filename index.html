
<!DOCTYPE html>
<html>
<head>
  <title>VIN Maintenance & Tire Lookup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>

<h2>Vehicle Maintenance & Tire Lookup</h2>

<input id="vin" placeholder="Enter VIN" style="width:100%;padding:10px;">
<button id="search" style="width:100%;padding:10px;margin-top:10px;">
  Lookup Vehicle
</button>

<pre id="output">Enter a VIN and click Lookup.</pre>

<script>
document.getElementById("search").onclick = async () => {
  const vin = document.getElementById("vin").value.trim();
  const out = document.getElementById("output");

  if (!vin) {
    out.textContent = "Please enter a VIN.";
    return;
  }

  out.textContent = "Looking up vehicle...";

  try {
    const res = await fetch(`/api/lookup?vin=${vin}`);
    const text = await res.text();

    try {
      out.textContent = JSON.stringify(JSON.parse(text), null, 2);
    } catch {
      out.textContent = "Server response:\n" + text;
    }
  } catch (e) {
    out.textContent = "Network error: " + e.message;
  }
};
</script>

</body>
</html>
