
<!DOCTYPE html>
<html>
<head>
  <title>Vehicle Maintenance Lookup</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 16px;
      background: #f9fafb;
      color: #111827;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    label {
      font-weight: bold;
      display: block;
      margin-top: 12px;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      font-size: 16px;
    }

    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 12px;
    }

    button:hover {
      background: #1d4ed8;
    }

    .section-title {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .muted {
      color: #6b7280;
      font-size: 14px;
    }

    ul {
      padding-left: 20px;
    }
  </style>
</head>

<body>

<h1>Vehicle Maintenance Lookup</h1>

<div class="card">
  <div class="section-title">🔍 Search by VIN</div>
  <label>VIN</label>
  <input id="vin" placeholder="Enter VIN (e.g. 1FTER4F...)">
  <button onclick="searchByVIN()">Search VIN</button>
</div>

<div class="card">
  <div class="section-title">🔍 OR Search by Year / Make / Model</div>

  <label>Year</label>
  <input id="year" placeholder="e.g. 2020">

  <label>Make</label>
  <input id="make" placeholder="e.g. Ford">

  <label>Model</label>
  <input id="model" placeholder="e.g. Ranger">

  <button onclick="searchByYMM()">Search Year / Make / Model</button>
</div>

<div id="results"></div>

<script>
async function searchByVIN() {
  const vin = document.getElementById("vin").value.trim();
  if (!vin) return alert("Please enter a VIN.");

  const res = await fetch(`/api/lookup?vin=${vin}`);
  const data = await res.json();
  render(data);
}

async function searchByYMM() {
  const year = document.getElementById("year").value.trim();
  const make = document.getElementById("make").value.trim();
  const model = document.getElementById("model").value.trim();

  if (!year || !make || !model) {
    return alert("Please enter Year, Make, and Model.");
  }

  const res = await fetch(
    `/api/lookup?year=${encodeURIComponent(year)}&make=${encodeURIComponent(make)}&model=${encodeURIComponent(model)}`
  );
  const data = await res.json();
  render(data);
}

function render(data) {
  const r = document.getElementById("results");

  if (data.error) {
    r.innerHTML = `<div class="card">${data.error}</div>`;
    return;
  }

  const v = data.vehicle;

  r.innerHTML = `
    <div class="card">
      <div class="section-title">🚗 Vehicle</div>
      <div><strong>${v.year} ${v.make} ${v.model}</strong></div>
      <div class="muted">${v.bodyClass || ""}</div>
    </div>

    ${data.maintenance ? `
    <div class="card">
      <div class="section-title">🔧 Maintenance</div>
      <ul>
        ${data.maintenance.map(m =>
          `<li><strong>${m.interval}</strong> – ${m.services.join(", ")}</li>`
        ).join("")}
      </ul>
    </div>` : ""}

    ${data.tires ? `
    <div class="card">
      <div class="section-title">🛞 Tires</div>
      <div>Front: ${data.tires.front}</div>
