
<!DOCTYPE html>
<html>
<head>
  <title>Vehicle Lookup</title>
</head>
<body>

<h1>Vehicle Lookup</h1>

<input id="vin" placeholder="Enter VIN">
<button onclick="lookup()">Search</button>

<div id="result"></div>

<script>
async function lookup() {
  const vin = document.getElementById("vin").value.trim();
  if (!vin) {
    alert("Enter a VIN");
    return;
  }

  const res = await fetch(`/api/lookup?vin=${vin}`);
  const data = await res.json();

  if (!data.vehicle) {
    document.getElementById("result").innerHTML =
      "<p>No vehicle data found.</p>";
    return;
  }

  let html = `
    <h2>${data.vehicle.year} ${data.vehicle.make} ${data.vehicle.model}</h2>
    <p>${data.vehicle.bodyClass || ""}</p>
  `;

  // ✅ Only render maintenance if it exists
  if (data.maintenance && data.maintenance.length) {
    html += "<h3>Maintenance</h3><ul>";
    for (const m of data.maintenance) {
      html += `<li><strong>${m.interval}</strong>: ${m.services.join(", ")}</li>`;
    }
    html += "</ul>";
  }

  document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>
